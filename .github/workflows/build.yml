name: Build & publish image

# Builds the app image on GitHub's runners, pushes it to GHCR, then SSHes into
# the VPS to pull + restart — so a push to main deploys itself, and the box
# never builds (which used to starve its 2 vCPUs and drop SSH).
# Requires repo secrets VPS_HOST / VPS_USER / VPS_SSH_KEY, and the VPS-side
# cutover in ops/ci-deploy.md (compose pointed at the GHCR image, deploy.sh
# swapped to pull-only, GHCR pull access from the box).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Skipped (not failed) until VPS_HOST/VPS_USER/VPS_SSH_KEY secrets exist —
    # see ops/ci-deploy.md.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Pull + restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /opt/ascenith && ./deploy.sh
